name: Docker Image Builder

run-name: ${{ github.actor }} is building and pushing a docker image for ${{ github.repository }}

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only if we want a new push to replace an existing build-in-progress.
  cancel-in-progress: true

jobs:
  docker_build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
           submodules: recursive
           token: ${{secrets.GITHUB_TOKEN}}

      - uses: actions/checkout@v4.2.2
      - name: configure docker builder
        run: docker buildx create --name container-builder --driver docker-container --bootstrap --use

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          build-args: |
          context: .
          push: true
          tags: ${{env.REGISTRY}}/${{env.IMAGE_NAME}}:latest
          builder: container-builder
          platforms: |
            linux/amd64
            linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          github-token: ${{secrets.GITHUB_TOKEN}}
