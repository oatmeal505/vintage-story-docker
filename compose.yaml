services:
  server:
    image: test:test
    container_name: vintage-story-server
    ports:
      - "42420:42420"
    environment:
      # User configuration
      - USERNAME=vintagestory # host machines user name 
      - USER_ID=1000 # host machines UID
      - GROUP_ID=1000 # host machines GID
      - GROUPNAME=vintagestory # host machines group

      - WHITELIST=true

      # for game version update/change alter the current version enviorment varriable to the new value
      # in order for this to take effect you will need to set the new version and set UPDATE_CONFIRM to true
      # NOTE: PLEASE BACK UP SERVER DATA BEFORE UPDATING
      - VERSION=1.22.7
      - UPDATE_CONFIRM="false"
    volumes:
      # 
      - /host-machine/data:/app/data
      - /host-machine/vintage-story-docker/server:/app/server